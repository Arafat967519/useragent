<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - User Agent Generator</title>
    <style>
        /* Base Background and alignment */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        /* Login Box Design */
        .login-box { background: #1e293b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 350px; color: white; }
        h2 { margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #334155; border-radius: 5px; font-size: 16px; outline: none; background: #0f172a; color: white; box-sizing: border-box; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #0ea5e9; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; box-sizing: border-box; }
        button:hover { background-color: #0284c7; }
        #errorMsg { margin-top: 15px; font-weight: bold; font-size: 14px; color: #ef4444; }
        
        /* Full Screen Iframe Area */
        #iframeArea { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background: #0f172a; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <!-- Key এন্টার করার ফর্ম -->
    <div class="login-box" id="loginArea">
        <h2>Premium Access</h2>
        <p style="color: #94a3b8; font-size: 14px;">Please enter your access key</p>
        <input type="text" id="userKey" placeholder="Enter your secret key">
        <button id="accessBtn">Unlock Tool</button>
        <p id="errorMsg"></p>
    </div>

    <!-- ফুল-স্ক্রিন Iframe এরিয়া -->
    <div id="iframeArea">
        <iframe src="https://useragent-generator-pro.netlify.app/" id="myIframe"></iframe>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlY-Jrvod035zBBDa_birWnsp-YkAN9Oc",
            authDomain: "useragent-4cafd.firebaseapp.com",
            projectId: "useragent-4cafd",
            storageBucket: "useragent-4cafd.firebasestorage.app",
            messagingSenderId: "193979237572",
            appId: "1:193979237572:web:c0adf0cfd8bb05eaa67591",
            measurementId: "G-9WMM9E5MSG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('accessBtn').onclick = async () => {
            const key = document.getElementById('userKey').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('accessBtn');

            if(!key) {
                errorMsg.innerText = "দয়া করে Key দিন!";
                return;
            }

            try {
                btn.innerText = "Checking...";
                errorMsg.innerText = "";

                const docRef = doc(db, "allowed_keys", key);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().valid === true) {
                    // Key সঠিক হলে Iframe ফুল স্ক্রিনে ওপেন হবে
                    document.getElementById('loginArea').style.display = "none";
                    document.getElementById('iframeArea').style.display = "block";
                } else {
                    errorMsg.innerText = "ভুল Key! দয়া করে সঠিক Key দিন।";
                    btn.innerText = "Unlock Tool";
                }
            } catch(error) {
                console.error("Error checking key: ", error);
                errorMsg.innerText = "সার্ভার এরর! ইন্টারনেট কানেকশন চেক করুন।";
                btn.innerText = "Unlock Tool";
            }
        }
    </script>
</body>
</html>
